name: Deploy to GitHub Pages

on:
  # 当推送到 main 分支时自动触发部署
  push:
    branches: [main]
  # 允许从 Actions 页面手动触发部署
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，让部署步骤可以写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，防止多个构建同时进行导致冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, build, and upload your site
        uses: withastro/action@v4
        # 如果你的 Astro 项目不在仓库根目录，可以设置 path
        # with:
        #   path: ./my-blog

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4